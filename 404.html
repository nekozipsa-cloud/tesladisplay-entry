<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeslaDisplay</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c0f14; color: #e8e8e8; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 30px; margin: 0; }
  p { font-size: 19px; margin: 0; color: #a9b1bd; line-height: 1.6; }
  .err { color: #ff8a80; }
  .spinner { width: 36px; height: 36px; border: 4px solid #2a3240; border-top-color: #4ea1ff; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  input { font-size: 24px; padding: 10px 14px; border-radius: 10px; border: 0; width: 160px; text-align: center; }
  button { font-size: 20px; padding: 12px 22px; border-radius: 10px; border: 0; background: #4ea1ff; color: #fff; font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="spinner" id="spin"></div>
  <h1 id="title">맥북을 찾는 중</h1>
  <p id="msg">잠시만 기다려 주세요.</p>
  <form id="keyform" style="display:none" onsubmit="go(document.getElementById('k').value); return false;">
    <input id="k" placeholder="접속 키" autocapitalize="off" autocomplete="off"> <button>연결</button>
  </form>
</main>
<script>
(function () {
  var NAME = /\.duckdns\.org$/.test(location.hostname) ? location.hostname : 'nekotesla.duckdns.org';
  var key = location.pathname.replace(/^\/+|\/+$/g, '').split('/')[0];
  var title = document.getElementById('title'), msg = document.getElementById('msg');
  var tries = 0;

  function show(t, m, err) { title.textContent = t; msg.textContent = m; msg.className = err ? 'err' : ''; }

  function txt() {
    var q = encodeURIComponent(NAME);
    var urls = ['https://dns.google/resolve?type=TXT&name=' + q + '&_=' + Date.now(),
                'https://cloudflare-dns.com/dns-query?type=TXT&name=' + q];
    var i = 0;
    return new Promise(function (resolve, reject) {
      (function next() {
        if (i >= urls.length) return reject(new Error('dns'));
        fetch(urls[i++], { headers: { accept: 'application/dns-json' }, cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(function (j) {
            var a = (j.Answer || []).filter(function (x) { return x.type === 16; });
            if (!a.length) return next();
            resolve(a[0].data.replace(/^"|"$/g, '').replace(/" "/g, ''));
          }).catch(next);
      })();
    });
  }

  function alive(base) {
    return fetch(base + '/health', { cache: 'no-store' }).then(function (r) { return r.ok; }, function () { return false; });
  }

  function attempt() {
    tries++;
    txt().then(function (base) {
      if (!/^https?:\/\//.test(base)) throw new Error('bad');
      return alive(base).then(function (ok) {
        // direct (Mac Wi-Fi) targets are private addresses the browser may not let us probe: just go
        if (ok || /^http:/.test(base)) {
          show('연결하는 중', '맥북을 찾았습니다.');
          location.replace(base.replace(/\/+$/, '') + '/' + encodeURIComponent(key));
        } else {
          show('맥북이 응답하지 않습니다', '맥북에서 TeslaDisplay가 켜져 있고 인터넷에 연결되어 있는지 확인하세요. 자동으로 다시 시도합니다.', true);
          setTimeout(attempt, 3000);
        }
      });
    }).catch(function () {
      show('맥북 주소를 찾지 못했습니다', '맥북에서 TeslaDisplay를 켜 주세요. 자동으로 다시 시도합니다.', true);
      setTimeout(attempt, 4000);
    });
  }

  window.go = function (k) { k = (k || '').trim(); if (k) location.replace('/' + encodeURIComponent(k)); };

  if (!key) {
    document.getElementById('spin').style.display = 'none';
    show('접속 키를 입력하세요', '맥북 메뉴바 TeslaDisplay에 표시된 주소 끝의 글자입니다.');
    document.getElementById('keyform').style.display = 'block';
  } else {
    attempt();
  }
})();
</script>
</body>
</html>
